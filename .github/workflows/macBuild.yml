name: Build Mac App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code

        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r libReqs.txt
          pip install pyinstaller

      - name: Build app with PyInstaller
        run: |
          pyinstaller --onefile --windowed stellarClient.py \
              --add-data="*.py:." \
              --add-data="keylog.txt:." \
              --add-data="*util:util" \
          mkdir dist-artifacts
          cp -r dist/* dist-artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacApp
          path: dist-artifacts
