name: Build Win App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout code

        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r libReqs.txt
          pip install pyinstaller

      - name: Build app with PyInstaller
        run: |
          pyinstaller --onefile --windowed stellarClient.py --add-data=keyboardScreen.py:. --add-data=gameScreen.py:.
          mkdir dist-artifacts
          cp -r dist/* dist-artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinApp
          path: dist-artifacts
